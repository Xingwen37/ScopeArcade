name: Windows checks and portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --self-test --data-dir build/source-selftest
      - run: python build_windows.py
      - name: Test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\ScopeArcade\ScopeArcade.exe -ArgumentList '--self-test','--data-dir','build/frozen-selftest' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Packaged self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ScopeArcade-Windows-x64
          path: release/ScopeArcade-v*-Windows-x64.zip
